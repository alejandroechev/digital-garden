name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Check types and style
        run: npm run check

      # Includes tests/site.test.ts: builds Scratchpad-rendered fixtures and
      # checks pages, attachments, links and backlinks.
      - name: Test
        run: npm test

      - name: Build the site
        run: npx quartz build
